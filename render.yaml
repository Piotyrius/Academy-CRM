services:
  # Production Backend Service
  - type: web
    name: academy-crm
    env: docker
    plan: hobby
    branch: main
    buildCommand: docker build -t academy-crm .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    preDeployCommand: bash scripts/pre_deploy.sh
    envVars:
      # Django Settings
      - key: DJANGO_SETTINGS_MODULE
        value: academy_crm.settings.prod
      
      # Database - Use DATABASE_URL from Render's database connection
      # Render will automatically provide DATABASE_URL pointing to the production database
      - key: DATABASE_URL
        fromDatabase:
          name: academy_crm
          property: connectionString
      
      # If DATABASE_URL is not available, fallback to individual variables
      # (These should be set manually in Render dashboard if DATABASE_URL doesn't work)
      - key: DB_NAME
        value: academy_crm
      - key: DB_USER
        fromDatabase:
          name: academy_crm
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: academy_crm
          property: password
      - key: DB_HOST
        fromDatabase:
          name: academy_crm
          property: host
      - key: DB_PORT
        fromDatabase:
          name: academy_crm
          property: port
      
      # Application Configuration
      - key: SECRET_KEY
        sync: false  # Must be set manually in Render dashboard
      - key: ALLOWED_HOSTS
        value: academy-crm.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # Set manually: https://acade-portal.onrender.com (or your prod frontend URL)
      - key: FRONTEND_URL
        sync: false  # Set manually: https://acade-portal.onrender.com (or your prod frontend URL)
      
      # Optional: Sentry, Email, Redis, etc.
      - key: SENTRY_DSN
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
      - key: USE_REDIS
        value: "false"  # Set to "true" if you have Redis

  # Staging Backend Service (Free Tier)
  - type: web
    name: academy-crm-staging
    env: docker
    plan: free
    branch: staging
    buildCommand: docker build -t academy-crm-staging .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    preDeployCommand: bash scripts/pre_deploy.sh
    envVars:
      # Django Settings
      - key: DJANGO_SETTINGS_MODULE
        value: academy_crm.settings.staging
      
      # Database - Staging uses the same PostgreSQL instance but different database
      # We need to construct DATABASE_URL manually since it's a different database name
      # Note: Render doesn't support per-database connection strings, so we use individual vars
      - key: DB_NAME
        value: academy_crm_staging
      - key: DB_USER
        fromDatabase:
          name: academy_crm  # Same database instance as production
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: academy_crm
          property: password
      - key: DB_HOST
        fromDatabase:
          name: academy_crm
          property: host
      - key: DB_PORT
        fromDatabase:
          name: academy_crm
          property: port
      
      # Alternative: Construct DATABASE_URL manually if you prefer
      # You can set this manually in Render dashboard using the staging DB connection string:
      # postgresql://USER:PASSWORD@HOST:PORT/academy_crm_staging
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard with staging database name
      
      # Application Configuration
      - key: SECRET_KEY
        sync: false  # Can use same or different key for staging
      - key: ALLOWED_HOSTS
        value: academy-crm-staging.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # Set manually: https://acade-portal-staging.onrender.com (or your staging frontend URL)
      - key: FRONTEND_URL
        sync: false  # Set manually: https://acade-portal-staging.onrender.com (or your staging frontend URL)
      
      # Optional: Sentry, Email, Redis, etc.
      - key: SENTRY_DSN
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend  # Console backend for staging
      - key: REDIS_URL
        sync: false
      - key: USE_REDIS
        value: "false"

# Note: Frontend services are in a separate repository, so they are not defined here.
# Configure frontend services separately in the frontend repository's render.yaml.

